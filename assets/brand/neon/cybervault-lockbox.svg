    <circle r="190" fill="none" stroke="#0b1119" stroke-width="20"/>
    <circle r="180" fill="none" stroke="#768694" stroke-opacity=".56" stroke-width="4"/>
    <circle r="188" fill="none" stroke="url(#rim)" stroke-width="4" stroke-dasharray="92 22 12 18"/>
    <circle r="170" fill="none" stroke="#000" stroke-opacity=".7" stroke-width="8" stroke-dasharray="2 14"/>
