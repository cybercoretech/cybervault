  <path d="M188 180 662 130l74 58M188 180v507M662 130v605" fill="none" stroke="#e9f1f7" stroke-opacity=".18" stroke-width="3"/>
  <path d="M208 204 646 158l66 48v418l-66 72-438-45z" fill="url(#mesh)" opacity=".8"/>
  <g filter="url(#bloom)" fill="#ffb347" stroke="#07090e" stroke-width="4">
