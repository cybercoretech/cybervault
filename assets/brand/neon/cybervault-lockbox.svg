<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">CyberVault hardened vault door</title>
  <desc id="desc">A dimensional steel vault door with neon circuit traces, locking rings, bolts, and a protected key core.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8796a3"/><stop offset=".08" stop-color="#263443"/><stop offset=".32" stop-color="#0d141d"/><stop offset=".57" stop-color="#354756"/><stop offset=".72" stop-color="#111b25"/><stop offset=".92" stop-color="#536574"/><stop offset="1" stop-color="#070b11"/></linearGradient>
    <linearGradient id="steelEdge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9c7d1"/><stop offset=".16" stop-color="#3a4b5b"/><stop offset=".5" stop-color="#111923"/><stop offset=".84" stop-color="#8293a1"/><stop offset="1" stop-color="#1b2733"/></linearGradient>
    <linearGradient id="darkSteel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b4b59"/><stop offset=".18" stop-color="#101923"/><stop offset=".8" stop-color="#070b11"/><stop offset="1" stop-color="#526370"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2ee6f6"/><stop offset=".43" stop-color="#9b6bff"/><stop offset="1" stop-color="#ff2e97"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#6ee7a8" stop-opacity=".9"/><stop offset=".35" stop-color="#2ee6f6" stop-opacity=".35"/><stop offset="1" stop-color="#07090e" stop-opacity="0"/></radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="18" result="off"/><feFlood flood-color="#000" flood-opacity=".8"/><feComposite in2="off" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="2" seed="8" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer><feBlend in="SourceGraphic" in2="mono" mode="soft-light"/></filter>
    <pattern id="mesh" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#2ee6f6" stroke-opacity=".1"/></pattern>
    <pattern id="brush" width="13" height="13" patternUnits="userSpaceOnUse"><path d="M0 2h13M0 8h13" stroke="#d9e6ed" stroke-opacity=".08"/><path d="M0 5h13M0 11h13" stroke="#000" stroke-opacity=".1"/></pattern>
  </defs>
