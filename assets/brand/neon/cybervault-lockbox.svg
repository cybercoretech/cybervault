<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">CyberVault hardened lockbox</title>
  <desc id="desc">A neon cyan and magenta lockbox enclosed by a security grid.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#2ee6f6"/>
      <stop offset=".52" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2ee6f6" stroke-opacity=".16"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#07090e"/>
  <circle cx="400" cy="370" r="300" fill="url(#grid)" opacity=".65"/>
  <circle cx="400" cy="370" r="250" fill="none" stroke="#2ee6f6" stroke-dasharray="2 18" stroke-width="2" opacity=".55"/>
  <circle cx="400" cy="370" r="205" fill="none" stroke="#ff2e97" stroke-dasharray="70 28" stroke-width="2" opacity=".45"/>
  <g filter="url(#glow)">
    <path d="M180 220h330l110 110v300H180z" fill="#111821" stroke="url(#edge)" stroke-width="8"/>
    <path d="M510 220v110h110" fill="none" stroke="#2ee6f6" stroke-width="6"/>
    <path d="M220 390h360M220 440h360M220 490h230" stroke="#3a4656" stroke-width="8"/>
    <circle cx="400" cy="590" r="78" fill="#111821" stroke="#6ee7a8" stroke-width="8"/>
    <rect x="370" y="580" width="60" height="56" rx="8" fill="#07090e" stroke="#6ee7a8" stroke-width="6"/>
    <path d="M382 580v-24a18 18 0 0 1 36 0v24" fill="none" stroke="#6ee7a8" stroke-width="6"/>
  </g>
  <path d="M92 690h150M558 690h150" stroke="#2ee6f6" stroke-width="3"/>
  <circle cx="72" cy="690" r="6" fill="#ffb347"/><circle cx="728" cy="690" r="6" fill="#ff2e97"/>
</svg>
